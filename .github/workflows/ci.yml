name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax gate
        run: for f in src/*.js examples/*.mjs; do node --check "$f"; done
      - name: Tests
        run: node --test
      - name: Demo (exit-code contract + artifacts)
        run: node examples/demo.mjs
